name: Delete User
description: Delete a user by ID - requires auth + admin role
version: 1.0.0
baseUrl: http://localhost:3000
apis:
  - name: Delete User - success
    run: true
    includeCookie: true
    url: /api/v1/auth/delete/<paste_user_uuid_here>
    headers:
      Method: DELETE

  - name: Delete User - not found
    run: true
    includeCookie: true
    url: /api/v1/auth/delete/00000000-0000-0000-0000-000000000000
    headers:
      Method: DELETE

  - name: Delete User - no token
    run: true
    includeCookie: false
    url: /api/v1/auth/delete/<paste_user_uuid_here>
    headers:
      Method: DELETE

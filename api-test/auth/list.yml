name: List Users
description: Get all users - requires auth
version: 1.0.0
baseUrl: http://localhost:3000
apis:
  - name: List Users - success
    run: true
    includeCookie: true
    url: /api/v1/auth/list
    headers:
      Method: GET

  - name: List Users - no token
    run: true
    includeCookie: false
    url: /api/v1/auth/list
    headers:
      Method: GET
